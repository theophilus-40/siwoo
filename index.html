
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chrome Dino Runner - Boss Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace, sans-serif;
            background-color: #111827;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .game-card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(239, 68, 68, 0.2);
        }
        .touch-btn {
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            border: 2px solid #4b5563;
            box-shadow: 0 4px 0 #111827;
            color: #f3f4f6;
        }
        .touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #111827;
        }
        .boss-warning-glow {
            animation: pulse-red 0.8s infinite alternate;
        }
        @keyframes pulse-red {
            0% { border-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
            100% { border-color: #f59e0b; box-shadow: 0 0 25px #f59e0b; }
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center p-2 md:p-4 text-slate-100">

    <!-- Main Container -->
    <div class="w-full max-w-4xl flex flex-col items-center">
        <!-- Header / Title -->
        <div class="w-full flex justify-between items-center mb-3 px-2">
            <h1 class="text-sm md:text-xl font-bold tracking-wider text-amber-400 flex items-center gap-2">
                <span>🦖</span> DINO RUNNER <span class="text-xs text-red-500 bg-red-950/60 px-2 py-1 rounded border border-red-800">BOSS EDITION</span>
            </h1>
            <div id="modeBadge" class="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700 font-sans">
                NORMAL RUN
            </div>
        </div>

        <!-- Game Canvas Screen Box -->
        <div id="canvasContainer" class="relative w-full bg-slate-900 rounded-xl game-card border-4 border-slate-700 overflow-hidden transition-all duration-300">
            <canvas id="gameCanvas" class="w-full h-auto block cursor-pointer"></canvas>

            <!-- Touch Controls Overlay for Mobile -->
            <div id="mobileControlsNormal" class="grid grid-cols-2 gap-2 p-3 bg-slate-900 border-t-2 border-slate-800 md:hidden">
                <button id="btnDuck" class="touch-btn py-3 text-xs font-bold rounded-lg active:bg-slate-700">
                    ⬇️ 엎드리기 (DUCK)
                </button>
                <button id="btnJump" class="touch-btn py-3 text-xs font-bold rounded-lg active:bg-slate-700">
                    ⬆️ 점프 (JUMP)
                </button>
            </div>

            <div id="mobileControlsBoss" class="hidden grid-cols-3 gap-2 p-3 bg-slate-950 border-t-2 border-red-900 md:hidden">
                <button id="btnLeft" class="touch-btn py-3 text-xs font-bold rounded-lg border-red-700">
                    ⬅️ 왼쪽
                </button>
                <button id="btnBossJump" class="touch-btn py-3 text-xs font-bold rounded-lg border-red-700">
                    ⬆️ 점프
                </button>
                <button id="btnRight" class="touch-btn py-3 text-xs font-bold rounded-lg border-red-700">
                    ➡️ 오른쪽
                </button>
            </div>
        </div>

        <!-- Instructions Section -->
        <div class="w-full mt-3 p-3.5 bg-slate-900/90 rounded-lg border border-slate-800 text-slate-300 text-[11px] leading-relaxed shadow-lg">
            <div class="flex justify-between items-center mb-2 border-b border-slate-800 pb-1.5">
                <span class="font-bold text-amber-400">🎮 조작법 (Controls)</span>
                <span class="text-red-400 font-bold">🚨 매 300점마다 100점간 보스전 진입!</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-slate-400">
                <div>
                    <span class="text-amber-300 font-bold">일반 모드:</span>
                    <div>• <span class="bg-slate-800 text-slate-200 px-1 rounded">Space</span> / <span class="bg-slate-800 text-slate-200 px-1 rounded">↑</span> : 점프 (구멍, 선인장 피하기)</div>
                    <div>• <span class="bg-slate-800 text-slate-200 px-1 rounded">↓</span> : 엎드리기 (높은 익룡 피하기)</div>
                </div>
                <div>
                    <span class="text-red-400 font-bold">보스전 모드 (3D 3레인):</span>
                    <div>• <span class="bg-slate-800 text-slate-200 px-1 rounded">←</span> / <span class="bg-slate-800 text-slate-200 px-1 rounded">→</span> : 레인 이동 (3칸 톰골드런 스타일)</div>
                    <div>• <span class="bg-slate-800 text-slate-200 px-1 rounded">↑</span> / <span class="bg-slate-800 text-slate-200 px-1 rounded">Space</span> : 레이저/가시 함정 점프</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sound FX Engine using Web Audio API
        class SoundController {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playLaneShift() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playBossAttack() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.25);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playWarning() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.setValueAtTime(400, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playScoreBeep() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1320, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }
        }

        const sound = new SoundController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 280;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const GROUND_Y = 220;

        // Game Modes: 'START', 'PLAYING_NORMAL', 'TRANSITION_TO_BOSS', 'PLAYING_BOSS', 'TRANSITION_TO_NORMAL', 'GAMEOVER'
        let gameState = 'START';
        let modeType = 'NORMAL'; // 'NORMAL' or 'BOSS'
        let gameSpeed = 6.5;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('dino_boss_high_score') || '0');
        let frameCount = 0;
        let lastScoreBeep = 0;
        let nextBossScoreTarget = 300;
        let bossExitScoreTarget = 0;

        // Warning Overlay Timer
        let warningTimer = 0;

        // Player Controls Object
        const keys = {
            jump: false,
            duck: false,
            left: false,
            right: false,
            leftPressed: false,
            rightPressed: false
        };

        const dino = {
            // Normal Mode Properties
            x: 60,
            y: GROUND_Y - 40,
            width: 40,
            height: 40,
            velocityY: 0,
            gravity: 0.68,
            jumpStrength: -12,
            isJumping: false,
            isDucking: false,
            isFallingInHole: false,
            legFrame: 0,

            // Boss Mode 3D Lane Properties (0 = Left, 1 = Center, 2 = Right)
            lane: 1, 
            targetLaneX: 400,
            currentLaneX: 400,
            bossY: GROUND_Y - 15,
            bossJumpY: 0,
            bossJumpVelY: 0,
            isBossJumping: false,

            reset() {
                this.x = 60;
                this.y = GROUND_Y - 40;
                this.width = 40;
                this.height = 40;
                this.velocityY = 0;
                this.isJumping = false;
                this.isDucking = false;
                this.isFallingInHole = false;
                this.legFrame = 0;

                this.lane = 1;
                this.currentLaneX = 400;
                this.targetLaneX = 400;
                this.bossJumpY = 0;
                this.bossJumpVelY = 0;
                this.isBossJumping = false;
            },

            jumpNormal() {
                if (!this.isJumping && !this.isFallingInHole) {
                    this.velocityY = this.jumpStrength;
                    this.isJumping = true;
                    sound.playJump();
                }
            },

            jumpBoss() {
                if (!this.isBossJumping) {
                    this.bossJumpVelY = -10;
                    this.isBossJumping = true;
                    sound.playJump();
                }
            },

            moveLane(dir) {
                if (dir === -1 && this.lane > 0) {
                    this.lane--;
                    sound.playLaneShift();
                } else if (dir === 1 && this.lane < 2) {
                    this.lane++;
                    sound.playLaneShift();
                }
            },

            updateNormal() {
                if (this.isFallingInHole) {
                    this.y += 6;
                    this.velocityY = 0;
                    return;
                }

                if (keys.jump && !this.isJumping) {
                    this.jumpNormal();
                }

                if (keys.jump && this.isJumping && this.velocityY < 0) {
                    this.velocityY -= 0.15;
                }

                if (keys.duck && this.isJumping) {
                    this.velocityY += 0.85;
                }

                this.velocityY += this.gravity;
                this.y += this.velocityY;

                if (keys.duck && !this.isJumping) {
                    this.isDucking = true;
                    this.height = 25;
                    this.width = 50;
                } else {
                    this.isDucking = false;
                    this.height = 40;
                    this.width = 40;
                }

                const currentGround = checkOverHole(this.x + this.width / 2) ? CANVAS_HEIGHT + 100 : GROUND_Y;

                if (this.y + this.height >= currentGround) {
                    if (currentGround > GROUND_Y) {
                        this.isFallingInHole = true;
                        triggerGameOver();
                    } else {
                        this.y = GROUND_Y - this.height;
                        this.velocityY = 0;
                        this.isJumping = false;
                    }
                }

                if (frameCount % 6 === 0) {
                    this.legFrame = (this.legFrame + 1) % 2;
                }
            },

            updateBoss() {
                // Smooth lane switching interpolation
                const lanePositions = [270, 400, 530];
                this.targetLaneX = lanePositions[this.lane];
                this.currentLaneX += (this.targetLaneX - this.currentLaneX) * 0.25;

                // Boss mode jump physics
                if (keys.jump && !this.isBossJumping) {
                    this.jumpBoss();
                }

                if (this.isBossJumping) {
                    this.bossJumpVelY += 0.75;
                    this.bossJumpY += this.bossJumpVelY;
                    if (this.bossJumpY >= 0) {
                        this.bossJumpY = 0;
                        this.bossJumpVelY = 0;
                        this.isBossJumping = false;
                    }
                }

                if (frameCount % 5 === 0) {
                    this.legFrame = (this.legFrame + 1) % 2;
                }
            },

            drawNormal() {
                ctx.fillStyle = '#f3f4f6';
                const x = this.x;
                const y = this.y;

                if (this.isDucking) {
                    ctx.fillRect(x + 5, y + 5, 35, 15);
                    ctx.fillRect(x + 35, y, 15, 12);
                    ctx.fillStyle = '#111827';
                    ctx.fillRect(x + 42, y + 2, 3, 3);
                    ctx.fillStyle = '#f3f4f6';
                    ctx.fillRect(x, y + 8, 8, 6);

                    if (!this.isJumping) {
                        if (this.legFrame === 0) {
                            ctx.fillRect(x + 12, y + 20, 4, 5);
                            ctx.fillRect(x + 28, y + 20, 4, 3);
                        } else {
                            ctx.fillRect(x + 12, y + 20, 4, 3);
                            ctx.fillRect(x + 28, y + 20, 4, 5);
                        }
                    } else {
                        ctx.fillRect(x + 15, y + 20, 4, 4);
                        ctx.fillRect(x + 25, y + 20, 4, 4);
                    }
                } else {
                    ctx.fillRect(x + 16, y, 20, 16);
                    ctx.fillRect(x + 24, y + 4, 16, 8);
                    ctx.fillStyle = '#111827';
                    ctx.fillRect(x + 22, y + 3, 3, 3);
                    ctx.fillStyle = '#f3f4f6';

                    ctx.fillRect(x + 8, y + 14, 22, 18);
                    ctx.fillRect(x + 26, y + 18, 5, 3);
                    ctx.fillRect(x, y + 16, 10, 8);
                    ctx.fillRect(x - 4, y + 14, 6, 5);

                    if (this.isJumping) {
                        ctx.fillRect(x + 10, y + 32, 5, 5);
                        ctx.fillRect(x + 20, y + 32, 5, 5);
                    } else {
                        if (this.legFrame === 0) {
                            ctx.fillRect(x + 10, y + 32, 5, 8);
                            ctx.fillRect(x + 22, y + 32, 5, 4);
                        } else {
                            ctx.fillRect(x + 10, y + 32, 5, 4);
                            ctx.fillRect(x + 22, y + 32, 5, 8);
                        }
                    }
                }
            },

            drawBoss() {
                // Back-view Pixel Dino for 3D Lane Mode
                const cx = this.currentLaneX;
                const cy = this.bossY + this.bossJumpY;

                ctx.fillStyle = '#f3f4f6';
                // Tail / Spine
                ctx.fillRect(cx - 4, cy - 30, 8, 20);
                // Back / Torso
                ctx.fillRect(cx - 14, cy - 22, 28, 18);
                // Head
                ctx.fillRect(cx - 10, cy - 42, 20, 14);
                // Spikes on back
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(cx - 2, cy - 38, 4, 4);
                ctx.fillRect(cx - 2, cy - 28, 4, 4);
                ctx.fillRect(cx - 2, cy - 18, 4, 4);

                // Running legs back view
                ctx.fillStyle = '#d1d5db';
                if (this.isBossJumping) {
                    ctx.fillRect(cx - 12, cy - 4, 8, 6);
                    ctx.fillRect(cx + 4, cy - 4, 8, 6);
                } else {
                    if (this.legFrame === 0) {
                        ctx.fillRect(cx - 12, cy - 4, 8, 10);
                        ctx.fillRect(cx + 4, cy - 4, 8, 4);
                    } else {
                        ctx.fillRect(cx - 12, cy - 4, 8, 4);
                        ctx.fillRect(cx + 4, cy - 4, 8, 10);
                    }
                }
            }
        };

        const boss = {
            x: 400,
            y: 50,
            width: 100,
            height: 70,
            hoverOffset: 0,
            attackTimer: 0,
            laneTarget: 1,
            health: 100,

            reset() {
                this.x = 400;
                this.y = 50;
                this.hoverOffset = 0;
                this.attackTimer = 0;
                this.laneTarget = 1;
                this.health = 100;
            },

            update() {
                this.hoverOffset = Math.sin(frameCount * 0.08) * 8;
                this.attackTimer++;

                // Boss changes attack lane and fires projectiles
                if (this.attackTimer > 65) {
                    this.attackTimer = 0;
                    this.laneTarget = Math.floor(Math.random() * 3);
                    spawnBossAttack(this.laneTarget);
                    sound.playBossAttack();
                }

                // Randomly spawn floor trap hazard
                if (Math.random() < 0.015) {
                    spawnFloorTrap(Math.floor(Math.random() * 3));
                }
            },

            draw() {
                const bx = this.x;
                const by = this.y + this.hoverOffset;

                // Mecha/Dragon Boss Pixel Sprite
                ctx.fillStyle = '#dc2626'; // Red Mech Body
                ctx.fillRect(bx - 40, by - 25, 80, 45);

                // Wings
                ctx.fillStyle = '#991b1b';
                const wingFlap = Math.sin(frameCount * 0.15) * 10;
                ctx.beginPath();
                ctx.moveTo(bx - 40, by - 10);
                ctx.lineTo(bx - 85, by - 35 + wingFlap);
                ctx.lineTo(bx - 40, by + 10);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(bx + 40, by - 10);
                ctx.lineTo(bx + 85, by - 35 + wingFlap);
                ctx.lineTo(bx + 40, by + 10);
                ctx.fill();

                // Eyes / Visor
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(bx - 25, by - 12, 18, 6);
                ctx.fillRect(bx + 7, by - 12, 18, 6);

                // Horns
                ctx.fillStyle = '#78350f';
                ctx.fillRect(bx - 30, by - 38, 8, 15);
                ctx.fillRect(bx + 22, by - 38, 8, 15);

                // Health Bar Header
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(250, 12, 300, 10);
                const progress = Math.max(0, (bossExitScoreTarget - score) / 100);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(250, 12, 300 * progress, 10);
                ctx.strokeStyle = '#f87171';
                ctx.strokeRect(250, 12, 300, 10);

                ctx.fillStyle = '#f87171';
                ctx.font = '8px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('MECHA DINO BOSS', 400, 8);
            }
        };

        let obstacles = [];
        let holes = [];
        let clouds = [];
        let bossAttacks = []; // Projectiles in Boss mode
        let floorTraps = [];  // Spikes/Lasers in Boss mode

        function checkOverHole(posX) {
            for (let hole of holes) {
                if (posX >= hole.x && posX <= hole.x + hole.width) {
                    return true;
                }
            }
            return false;
        }

        function spawnHole() {
            const minWidth = 65;
            const maxWidth = 105;
            const width = Math.floor(Math.random() * (maxWidth - minWidth)) + minWidth;
            holes.push({ x: CANVAS_WIDTH + 50, width: width });
        }

        function spawnCactus() {
            const types = ['SMALL_SINGLE', 'SMALL_DOUBLE', 'LARGE_SINGLE', 'LARGE_GROUP'];
            const type = types[Math.floor(Math.random() * types.length)];
            let width = 20;
            let height = 38;

            if (type === 'SMALL_DOUBLE') width = 38;
            if (type === 'LARGE_SINGLE') { height = 50; width = 24; }
            if (type === 'LARGE_GROUP') { height = 50; width = 55; }

            obstacles.push({
                type: 'CACTUS',
                x: CANVAS_WIDTH + 20,
                y: GROUND_Y - height,
                width: width,
                height: height,
                subType: type
            });
        }

        function spawnPterodactyl() {
            const heightLevels = [GROUND_Y - 75, GROUND_Y - 55, GROUND_Y - 35];
            const chosenY = heightLevels[Math.floor(Math.random() * heightLevels.length)];

            obstacles.push({
                type: 'PTERODACTYL',
                x: CANVAS_WIDTH + 20,
                y: chosenY,
                width: 42,
                height: 30,
                wingFrame: 0
            });
        }

        function spawnBossAttack(laneIndex) {
            bossAttacks.push({
                lane: laneIndex,
                z: 0, // 0 = far away near boss, 1 = reaches player position
                speed: 0.025 + Math.min(0.02, (score / 1000) * 0.005),
                size: 15
            });
        }

        function spawnFloorTrap(laneIndex) {
            floorTraps.push({
                lane: laneIndex,
                z: 0,
                speed: 0.022,
                type: Math.random() < 0.5 ? 'SPIKE' : 'LASER'
            });
        }

        let spawnTimer = 0;
        let nextSpawnInterval = 75;

        function handleNormalSpawning() {
            spawnTimer++;
            if (spawnTimer >= nextSpawnInterval) {
                spawnTimer = 0;
                nextSpawnInterval = Math.floor(Math.random() * 45) + Math.max(35, 80 - Math.floor(gameSpeed * 2));

                const rand = Math.random();
                if (rand < 0.25) {
                    spawnHole();
                } else if (rand < 0.65) {
                    spawnCactus();
                } else {
                    spawnPterodactyl();
                }
            }

            if (Math.random() < 0.012) {
                clouds.push({
                    x: CANVAS_WIDTH + 30,
                    y: Math.random() * 80 + 20,
                    width: 46,
                    speed: 1 + Math.random() * 0.5
                });
            }
        }

        function drawCactus(obs) {
            ctx.fillStyle = '#22c55e';
            const x = obs.x;
            const y = obs.y;
            const w = obs.width;
            const h = obs.height;

            if (obs.subType === 'SMALL_SINGLE' || obs.subType === 'LARGE_SINGLE') {
                ctx.fillRect(x + w*0.3, y, w*0.4, h);
                ctx.fillRect(x, y + h*0.3, w*0.3, h*0.15);
                ctx.fillRect(x, y + h*0.2, w*0.15, h*0.25);
                ctx.fillRect(x + w*0.7, y + h*0.4, w*0.3, h*0.15);
                ctx.fillRect(x + w*0.85, y + h*0.3, w*0.15, h*0.25);
            } else {
                const count = obs.subType === 'SMALL_DOUBLE' ? 2 : 3;
                const itemW = w / count;
                for (let i = 0; i < count; i++) {
                    const cx = x + i * itemW;
                    ctx.fillRect(cx + itemW*0.3, y, itemW*0.4, h);
                    ctx.fillRect(cx + itemW*0.1, y + h*0.3, itemW*0.8, h*0.12);
                }
            }
        }

        function drawPterodactyl(obs) {
            ctx.fillStyle = '#f59e0b';
            const x = obs.x;
            const y = obs.y;

            if (frameCount % 10 === 0) {
                obs.wingFrame = (obs.wingFrame + 1) % 2;
            }

            ctx.fillRect(x + 10, y + 12, 22, 8);
            ctx.fillRect(x + 28, y + 6, 12, 8);
            ctx.fillRect(x, y + 14, 10, 4);

            if (obs.wingFrame === 0) {
                ctx.beginPath();
                ctx.moveTo(x + 18, y + 12);
                ctx.lineTo(x + 10, y - 4);
                ctx.lineTo(x + 26, y + 12);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(x + 18, y + 16);
                ctx.lineTo(x + 12, y + 28);
                ctx.lineTo(x + 26, y + 16);
                ctx.fill();
            }
        }

        function drawGroundAndHoles() {
            ctx.fillStyle = '#475569';
            holes.sort((a, b) => a.x - b.x);

            let currentX = 0;
            for (let hole of holes) {
                if (hole.x > currentX) {
                    ctx.fillRect(currentX, GROUND_Y, Math.min(CANVAS_WIDTH, hole.x) - currentX, 3);
                }
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(hole.x, GROUND_Y, 3, 30);
                ctx.fillRect(hole.x + hole.width - 3, GROUND_Y, 3, 30);
                ctx.fillStyle = '#475569';

                currentX = Math.max(currentX, hole.x + hole.width);
            }

            if (currentX < CANVAS_WIDTH) {
                ctx.fillRect(currentX, GROUND_Y, CANVAS_WIDTH - currentX, 3);
            }

            ctx.fillStyle = '#334155';
            for (let i = 0; i < CANVAS_WIDTH; i += 35) {
                let dotX = (i - (frameCount * gameSpeed % 35) + CANVAS_WIDTH) % CANVAS_WIDTH;
                if (!checkOverHole(dotX)) {
                    ctx.fillRect(dotX, GROUND_Y + 10, 4, 2);
                    ctx.fillRect((dotX + 15) % CANVAS_WIDTH, GROUND_Y + 18, 2, 2);
                }
            }
        }

        function draw3DLanes() {
            // Pseudo 3D perspective background for Boss Mode
            const horizonY = 90;
            const bottomY = CANVAS_HEIGHT;

            // Gradient background
            const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            bgGrad.addColorStop(0, '#1a0505');
            bgGrad.addColorStop(0.5, '#2a0a0a');
            bgGrad.addColorStop(1, '#0f0f17');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 3 Lane boundaries perspective lines
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;

            const vpX = 400; // Vanishing point X
            const laneStartBottoms = [140, 270, 400, 530, 660];
            const laneStartTops = [330, 365, 400, 435, 470];

            for (let i = 0; i < laneStartBottoms.length; i++) {
                ctx.beginPath();
                ctx.moveTo(laneStartTops[i], horizonY);
                ctx.lineTo(laneStartBottoms[i], bottomY);
                ctx.stroke();
            }

            // Moving perspective speed lines across ground
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.lineWidth = 1;
            const gridOffset = (frameCount * 8) % 30;
            for (let z = 0; z < CANVAS_HEIGHT - horizonY; z += 20) {
                let yPos = horizonY + z + (gridOffset * (z / (CANVAS_HEIGHT - horizonY)));
                if (yPos < CANVAS_HEIGHT) {
                    ctx.beginPath();
                    ctx.moveTo(200, yPos);
                    ctx.lineTo(600, yPos);
                    ctx.stroke();
                }
            }
        }

        function drawBossAttacksAndTraps() {
            const laneXSpans = [
                { top: 347, bottom: 205 }, // Lane 0 (Left)
                { top: 400, bottom: 400 }, // Lane 1 (Center)
                { top: 452, bottom: 595 }  // Lane 2 (Right)
            ];
            const horizonY = 90;

            // Draw Floor Traps
            for (let trap of floorTraps) {
                const span = laneXSpans[trap.lane];
                const currentX = span.top + (span.bottom - span.top) * trap.z;
                const currentY = horizonY + (CANVAS_HEIGHT - horizonY) * trap.z;
                const scale = 0.2 + 0.8 * trap.z;

                if (trap.type === 'SPIKE') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.moveTo(currentX - 15 * scale, currentY);
                    ctx.lineTo(currentX, currentY - 25 * scale);
                    ctx.lineTo(currentX + 15 * scale, currentY);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(currentX - 25 * scale, currentY - 5 * scale, 50 * scale, 10 * scale);
                }
            }

            // Draw Flying Projectiles (Fireballs)
            for (let att of bossAttacks) {
                const span = laneXSpans[att.lane];
                const currentX = span.top + (span.bottom - span.top) * att.z;
                const currentY = horizonY + (GROUND_Y - horizonY) * att.z;
                const radius = 6 + 18 * att.z;

                // Fireball glow
                const grad = ctx.createRadialGradient(currentX, currentY, radius * 0.2, currentX, currentY, radius);
                grad.addColorStop(0, '#fef08a');
                grad.addColorStop(0.5, '#f97316');
                grad.addColorStop(1, 'rgba(220, 38, 38, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(currentX, currentY, radius * 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(currentX, currentY, radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawClouds() {
            ctx.fillStyle = '#334155';
            for (let c of clouds) {
                ctx.fillRect(c.x, c.y, c.width, 10);
                ctx.fillRect(c.x + 8, c.y - 6, c.width - 16, 18);
            }
        }

        function checkNormalCollisions() {
            for (let obs of obstacles) {
                const padding = 6;
                if (
                    dino.x + padding < obs.x + obs.width - padding &&
                    dino.x + dino.width - padding > obs.x + padding &&
                    dino.y + padding < obs.y + obs.height - padding &&
                    dino.y + dino.height - padding > obs.y + padding
                ) {
                    triggerGameOver();
                    return;
                }
            }
        }

        function checkBossCollisions() {
            // Check Boss Fireball Hits
            for (let att of bossAttacks) {
                if (att.z > 0.82 && att.z < 0.98) {
                    if (att.lane === dino.lane && dino.bossJumpY > -15) {
                        triggerGameOver();
                        return;
                    }
                }
            }

            // Check Floor Trap Hits
            for (let trap of floorTraps) {
                if (trap.z > 0.85 && trap.z < 0.98) {
                    if (trap.lane === dino.lane) {
                        if (trap.type === 'SPIKE' && dino.bossJumpY > -20) {
                            triggerGameOver();
                            return;
                        } else if (trap.type === 'LASER' && dino.bossJumpY > -15) {
                            triggerGameOver();
                            return;
                        }
                    }
                }
            }
        }

        function enterBossMode() {
            modeType = 'BOSS';
            gameState = 'PLAYING_BOSS';
            bossExitScoreTarget = score + 100;
            boss.reset();
            bossAttacks = [];
            floorTraps = [];
            sound.playWarning();

            // Toggle mobile UI
            document.getElementById('mobileControlsNormal').classList.add('hidden');
            document.getElementById('mobileControlsBoss').classList.remove('hidden');
            document.getElementById('mobileControlsBoss').classList.add('grid');
            document.getElementById('modeBadge').textContent = '⚠️ BOSS BATTLE';
            document.getElementById('modeBadge').className = 'text-xs px-2.5 py-1 rounded-md bg-red-900 text-red-200 border border-red-700 font-sans font-bold animate-pulse';
            document.getElementById('canvasContainer').classList.add('boss-warning-glow');
        }

        function exitBossMode() {
            modeType = 'NORMAL';
            gameState = 'PLAYING_NORMAL';
            nextBossScoreTarget = Math.floor(score) + (300 - (Math.floor(score) % 300));
            obstacles = [];
            holes = [];

            // Toggle mobile UI
            document.getElementById('mobileControlsBoss').classList.add('hidden');
            document.getElementById('mobileControlsBoss').classList.remove('grid');
            document.getElementById('mobileControlsNormal').classList.remove('hidden');
            document.getElementById('modeBadge').textContent = 'NORMAL RUN';
            document.getElementById('modeBadge').className = 'text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700 font-sans';
            document.getElementById('canvasContainer').classList.remove('boss-warning-glow');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            sound.playHit();

            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('dino_boss_high_score', highScore.toString());
            }
        }

        function resetGame() {
            dino.reset();
            boss.reset();
            obstacles = [];
            holes = [];
            clouds = [];
            bossAttacks = [];
            floorTraps = [];
            score = 0;
            gameSpeed = 6.5;
            frameCount = 0;
            spawnTimer = 0;
            lastScoreBeep = 0;
            nextBossScoreTarget = 300;
            exitBossMode();
            gameState = 'PLAYING_NORMAL';
        }

        function update() {
            if (gameState === 'START' || gameState === 'GAMEOVER') return;

            frameCount++;
            score += 0.15;
            gameSpeed += 0.0006;

            // Score Sound Beep
            let currentScoreInt = Math.floor(score);
            if (currentScoreInt > 0 && currentScoreInt % 100 === 0 && currentScoreInt !== lastScoreBeep) {
                sound.playScoreBeep();
                lastScoreBeep = currentScoreInt;
            }

            // Check Boss Trigger Transition
            if (modeType === 'NORMAL' && currentScoreInt >= nextBossScoreTarget) {
                enterBossMode();
            } else if (modeType === 'BOSS' && currentScoreInt >= bossExitScoreTarget) {
                exitBossMode();
            }

            if (modeType === 'NORMAL') {
                dino.updateNormal();

                // Update Holes & Obstacles
                for (let i = holes.length - 1; i >= 0; i--) {
                    holes[i].x -= gameSpeed;
                    if (holes[i].x + holes[i].width < -50) holes.splice(i, 1);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= gameSpeed;
                    if (obstacles[i].x + obstacles[i].width < -50) obstacles.splice(i, 1);
                }

                for (let i = clouds.length - 1; i >= 0; i--) {
                    clouds[i].x -= clouds[i].speed;
                    if (clouds[i].x + clouds[i].width < -50) clouds.splice(i, 1);
                }

                handleNormalSpawning();
                checkNormalCollisions();
            } else {
                // BOSS MODE UPDATE
                dino.updateBoss();
                boss.update();

                // Update Boss Projectiles
                for (let i = bossAttacks.length - 1; i >= 0; i--) {
                    bossAttacks[i].z += bossAttacks[i].speed;
                    if (bossAttacks[i].z > 1.1) bossAttacks.splice(i, 1);
                }

                // Update Floor Traps
                for (let i = floorTraps.length - 1; i >= 0; i--) {
                    floorTraps[i].z += floorTraps[i].speed;
                    if (floorTraps[i].z > 1.1) floorTraps.splice(i, 1);
                }

                checkBossCollisions();
            }
        }

        function draw() {
            if (modeType === 'NORMAL') {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                drawClouds();
                drawGroundAndHoles();

                for (let obs of obstacles) {
                    if (obs.type === 'CACTUS') drawCactus(obs);
                    else if (obs.type === 'PTERODACTYL') drawPterodactyl(obs);
                }

                dino.drawNormal();
            } else {
                // BOSS MODE DRAW
                draw3DLanes();
                drawBossAttacksAndTraps();
                boss.draw();
                dino.drawBoss();
            }

            // HUD Score Display
            ctx.fillStyle = '#f3f4f6';
            ctx.font = '12px "Press Start 2P", monospace';
            ctx.textAlign = 'right';
            const padScore = (num) => Math.floor(num).toString().padStart(5, '0');
            ctx.fillText(`HI ${padScore(highScore)}  ${padScore(score)}`, CANVAS_WIDTH - 20, 30);

            // Overlays
            if (gameState === 'START') {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fbbf24';
                ctx.font = '16px "Press Start 2P", monospace';
                ctx.fillText('PRESS SPACE TO START', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 10);
                
                ctx.font = '10px "Press Start 2P", monospace';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('AVOID CACTI & HOLES | BOSS AT 300 PTS!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 25);
            } else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ef4444';
                ctx.font = '20px "Press Start 2P", monospace';
                ctx.fillText('G A M E  O V E R', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 15);

                ctx.font = '11px "Press Start 2P", monospace';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText('PRESS SPACE OR TAP TO RESTART', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function handleInputStart(action) {
            sound.init();

            if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
                return;
            }

            if (modeType === 'NORMAL') {
                if (action === 'JUMP') keys.jump = true;
                if (action === 'DUCK') keys.duck = true;
            } else {
                // BOSS MODE INPUTS
                if (action === 'LEFT') dino.moveLane(-1);
                if (action === 'RIGHT') dino.moveLane(1);
                if (action === 'JUMP') keys.jump = true;
            }
        }

        function handleInputEnd(action) {
            if (action === 'JUMP') keys.jump = false;
            if (action === 'DUCK') keys.duck = false;
        }

        // Keyboard Event Handlers
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleInputStart('JUMP');
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                handleInputStart('DUCK');
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                handleInputStart('LEFT');
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                e.preventDefault();
                handleInputStart('RIGHT');
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInputEnd('JUMP');
            if (e.code === 'ArrowDown') handleInputEnd('DUCK');
        });

        // Mouse Click Fallback
        canvas.addEventListener('mousedown', () => handleInputStart('JUMP'));

        // Mobile Touch Button Listeners
        const btnJump = document.getElementById('btnJump');
        const btnDuck = document.getElementById('btnDuck');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnBossJump = document.getElementById('btnBossJump');

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('JUMP'); });
        btnJump.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd('JUMP'); });
        btnDuck.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('DUCK'); });
        btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd('DUCK'); });

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('LEFT'); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('RIGHT'); });
        btnBossJump.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('JUMP'); });
        btnBossJump.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd('JUMP'); });

        // Start Animation Loop on Load
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
